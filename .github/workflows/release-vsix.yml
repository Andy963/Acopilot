name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all:ci

      - name: Run validators
        run: npm run validate

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Find VSIX
        id: vsix
        shell: bash
        run: |
          set -euo pipefail
          VSIX=$(ls -1 *.vsix | head -n 1)
          echo "vsix_path=${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" {found=1}
            found && $0 ~ "^## \\[" && $0 !~ "^## \\["ver"\\]" {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found for version: ${VERSION}" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VSIX_PATH: ${{ steps.vsix.outputs.vsix_path }}
